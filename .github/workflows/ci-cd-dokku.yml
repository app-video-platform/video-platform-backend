name: CI/CD Dokku

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: ./mvnw -B -ntp test

  deploy-dokku:
    name: Deploy to DigitalOcean Dokku
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          DOKKU_HOST: ${{ secrets.DOKKU_HOST }}
          DOKKU_APP_NAME: ${{ secrets.DOKKU_APP_NAME }}
          DOKKU_SSH_PRIVATE_KEY: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}
        run: |
          test -n "$DOKKU_HOST" || (echo "Missing secret: DOKKU_HOST" && exit 1)
          test -n "$DOKKU_APP_NAME" || (echo "Missing secret: DOKKU_APP_NAME" && exit 1)
          test -n "$DOKKU_SSH_PRIVATE_KEY" || (echo "Missing secret: DOKKU_SSH_PRIVATE_KEY" && exit 1)

      - name: Configure SSH
        env:
          DOKKU_HOST: ${{ secrets.DOKKU_HOST }}
          DOKKU_SSH_PRIVATE_KEY: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}
          DOKKU_SSH_PORT: ${{ secrets.DOKKU_SSH_PORT }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DOKKU_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          PORT="${DOKKU_SSH_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$DOKKU_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Push to Dokku
        env:
          DOKKU_HOST: ${{ secrets.DOKKU_HOST }}
          DOKKU_APP_NAME: ${{ secrets.DOKKU_APP_NAME }}
          DOKKU_SSH_PORT: ${{ secrets.DOKKU_SSH_PORT }}
          DOKKU_DEPLOY_BRANCH: ${{ vars.DOKKU_DEPLOY_BRANCH }}
        run: |
          PORT="${DOKKU_SSH_PORT:-22}"
          BRANCH="${DOKKU_DEPLOY_BRANCH:-main}"
          REMOTE_URL="dokku@${DOKKU_HOST}:${DOKKU_APP_NAME}"

          git remote remove dokku >/dev/null 2>&1 || true
          git remote add dokku "$REMOTE_URL"

          GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -p $PORT" \
            git push dokku "HEAD:${BRANCH}"
